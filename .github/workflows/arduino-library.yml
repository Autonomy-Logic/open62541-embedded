# Generate the Arduino library form of this fork and publish it to the
# `arduino-library` branch — which is this repository's DEFAULT branch, so
# `arduino-cli lib install --git-url <repo>` installs a working library.
#
# The library has to BE on a branch rather than be a release artefact: git-url
# installs clone a ref, so whatever a user gets must already be the library.
name: Arduino library

on:
  push:
    branches: [arduino-embedded]
  workflow_dispatch:

# The publish step pushes a generated branch back to this repository, so the
# job's token needs write access to contents. Workflows get read-only by
# default, which fails at the very last step with a 403 after doing all the
# work — everything green and nothing published.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake python3
          # No pip install: the generators this build runs
          # (tools/generate_datatypes.py and nodeset_compiler) import only the
          # standard library plus the repository's own modules. An earlier
          # version installed from tools/requirements.txt, which does not exist
          # in this tree -- masked by `|| true`, so it printed an error and
          # carried on looking healthy.

      - name: Generate the library
        run: tools/arduino/generate-arduino-library.sh

      # Proves the "compiles anywhere" claim rather than asserting it. Two very
      # different targets: ARM Cortex-M (the reason this fork exists) and
      # Xtensa (ESP32), which is where the per-architecture precompiled
      # approach this replaces would have needed a whole extra build.
      # NO SHIM. That is the whole test.
      #
      # This step used to add a hand-written /tmp/shim/sys/socket.h to the
      # include path, which made it pass whether or not the library was
      # self-contained — it was proving that a shim works, not that the
      # library needs none. Bare-metal ARM has no system socket header, so
      # compiling without one is exactly the property being claimed.
      - name: Compile smoke test — ARM Cortex-M4, no system headers
        run: |
          sudo apt-get install -y -qq gcc-arm-none-eabi
          arm-none-eabi-gcc -mcpu=cortex-m4 -mthumb -mfloat-abi=hard -mfpu=fpv4-sp-d16 \
            -Os -w -ffunction-sections -fdata-sections \
            -fno-unwind-tables -fno-asynchronous-unwind-tables \
            -c build-arduino/library/src/open62541.c -o /tmp/m4.o \
            -Ibuild-arduino/library/src
          arm-none-eabi-size /tmp/m4.o

      - name: Check the size did not regress
        run: |
          # .bss must stay at zero: the const-type-tables change is worth
          # ~45 KB of RAM and losing it in a rebase must fail the build, not
          # quietly cost every user that memory.
          BSS=$(arm-none-eabi-size /tmp/m4.o | awk 'NR==2 {print $3}')
          echo "bss = $BSS"
          if [ "$BSS" -gt 1024 ]; then
            echo "::error::.bss is $BSS bytes; expected ~0. The const-type-tables change is probably missing."
            exit 1
          fi

      - name: Publish to the arduino-library branch
        if: github.ref == 'refs/heads/arduino-embedded'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SRC="$(git rev-parse --short HEAD)"
          # An orphan commit each time: this branch is generated output, not
          # history worth keeping, and its 7 MB of sources would otherwise
          # accumulate a copy per build in everyone's clone.
          git checkout --orphan arduino-library-tmp
          git rm -rqf . --cached
          find . -maxdepth 1 -mindepth 1 \
            ! -name build-arduino ! -name .git ! -name .github -exec rm -rf {} +
          cp -r build-arduino/library/. .
          rm -rf build-arduino .github
          git add -A
          git commit -q -m "Arduino library build from arduino-embedded@${SRC}"
          git push -f origin arduino-library-tmp:arduino-library
